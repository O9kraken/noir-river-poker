# Render Blueprint: New -> Blueprint -> pick this repo, everything else is filled in.
services:
  - type: web
    name: noir-river-poker
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "true"
      # your nickname(s) for the admin panel, comma-separated; Render asks for it on deploy
      - key: ADMIN_NAMES
        sync: false
      # PostgreSQL connection string (Neon / Supabase); without it data lives in a file and is lost on restart
      - key: DATABASE_URL
        sync: false
