<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админка — NOIR RIVER</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0D0C">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/play.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a href="/play" class="brand"><span class="brand-mark" aria-hidden="true">♠&#xFE0E;</span><span class="brand-text">NOIR RIVER</span></a>
    <div class="topbar-right">
      <span class="status running" id="adm-live">онлайн</span>
      <a href="/play" class="btn btn-ghost btn-sm">К игре</a>
    </div>
  </header>

  <main class="adm">
    <div class="adm-head">
      <div>
        <p class="eyebrow">Администрирование</p>
        <h1 class="h1">Панель управления</h1>
      </div>
      <p class="muted small" id="adm-updated"></p>
    </div>

    <div id="adm-denied" class="empty" hidden></div>

    <div id="adm-body" hidden>
      <div class="tabs adm-tabs" role="tablist">
        <button type="button" role="tab" class="tab is-active" data-adm-tab="overview" aria-selected="true">Обзор</button>
        <button type="button" role="tab" class="tab" data-adm-tab="users" aria-selected="false">Игроки</button>
        <button type="button" role="tab" class="tab" data-adm-tab="tables" aria-selected="false">Покер</button>
        <button type="button" role="tab" class="tab" data-adm-tab="sng" aria-selected="false">Турниры</button>
        <button type="button" role="tab" class="tab" data-adm-tab="durak" aria-selected="false">Дурак</button>
        <button type="button" role="tab" class="tab" data-adm-tab="announce" aria-selected="false">Объявления</button>
      </div>
      <section id="adm-main" class="adm-main"></section>
    </div>
  </main>
</div>

<dialog id="adm-pass" class="modal">
  <div class="form">
    <h2 class="h2">Новый пароль</h2>
    <p class="muted" id="adm-pass-text"></p>
    <div class="buyin-amount" id="adm-pass-value"></div>
    <p class="muted small">Передайте его игроку. Все его сессии закрыты — войти можно только с новым паролем.</p>
    <div class="modal-actions"><button type="button" class="btn btn-gold" data-close>Готово</button></div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/admin.js"></script>
</body>
</html>
